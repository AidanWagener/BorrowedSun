<text x="55" y="989" >Culture output consumes crop substrate. Urban fresh is a subset of Saffron delivery, not additional food.</text>
<text x="55" y="1017" >Lower-harvest case: 186 t/turn shortfall. Regional residents and other exports are additional.</text>
<text x="55" y="1055" style="font-size:17px;font-weight:bold">Long natural nights require a crop strategy and a real source of energy.</text>
<text x="55" y="1083" >Nacre staples use selected long-cycle lines; full artificial-light alternatives carry explicit power costs.</text>
<text x="55" y="1131" style="font-size:14px">Authoritative assumptions: nacre_production.json · source allocation: Exchange/nacre_exchange.json</text>
