<text x="50" y="77" >700 tonnes of edible product per 24-hour civil turn · 420,000 residents · authored demand allowance</text>
<text x="50" y="103" class="small">Both panels describe the same total. Production capacity, nutrition and transport feasibility remain unverified.</text>
