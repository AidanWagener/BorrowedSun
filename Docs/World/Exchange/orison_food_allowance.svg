<title id="title">Orison core food allowance: origin and composition</title>
<desc id="desc">Two bar charts show the same 700 tonnes per civil turn, once by productive origin and once by product category. These totals must not be added together.</desc>
<rect width="1440" height="690" fill="#f1eddf"/>
<style>text{font-family:Arial,sans-serif;fill:#273e43;font-size:16px}.small{font-size:13px}.grid{stroke:#b6c4be;stroke-width:.7}</style>
